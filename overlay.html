
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basketball Scoreboard Overlay</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: transparent;
    font-family: Arial, sans-serif;
    color: white;
  }
  .scorebug {
    display: inline-flex; align-items: stretch;
    background: rgba(15,23,42,.96);
    border: 2px solid #334155; border-radius: 8px;
    overflow: hidden; box-shadow: 0 4px 15px #0008;
  }
  .team {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
  }
  .team-name {
    font-size: 20px; font-weight: 900;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .team-score {
    min-width: 35px; text-align: center;
    font-size: 30px; font-weight: 900; color: #facc15;
  }
  .divider { width: 2px; background: #475569; }
  .match-info {
    min-width: 100px; padding: 8px 14px;
    background: #1e293b; text-align: center;
    display: flex; flex-direction: column; justify-content: center;
  }
  .period { font-size: 14px; font-weight: bold; color: #38bdf8; }
  .clock {
    font-family: monospace; font-size: 23px;
    font-weight: 900; font-variant-numeric: tabular-nums;
  }
  .paused { color: #facc15; }
  #error { color: #fca5a5; font: 12px Arial; }
</style>
</head>
<body>
<div class="scorebug">
  <div class="team">
    <span class="team-name" id="homeName">HOME</span>
    <span class="team-score" id="homeScore">0</span>
  </div>
  <div class="divider"></div>
  <div class="team">
    <span class="team-score" id="awayScore">0</span>
    <span class="team-name" id="awayName">AWAY</span>
  </div>
  <div class="divider"></div>
  <div class="match-info">
    <div class="period" id="period">Q1</div>
    <div class="clock" id="clock">10:00</div>
    <div id="clockStatus" style="font-size:10px;color:#94a3b8">PAUSED</div>
  </div>
</div>
<div id="error"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDNRAxQjrJHaPygvWc2RvU0ING1OZ7Eya8",
  authDomain: "basketball-scoreboard-aac31.firebaseapp.com",
  databaseURL: "https://basketball-scoreboard-aac31-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "basketball-scoreboard-aac31",
  storageBucket: "basketball-scoreboard-aac31.firebasestorage.app",
  messagingSenderId: "419988352356",
  appId: "1:419988352356:web:36ca2bdb06acc0eb9cde71"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let clockState = {
  remainingMs: 600000,
  running: false,
  startedAt: null
};

function getRemaining() {
  const base = Math.max(0, Number(clockState.remainingMs || 0));
  if (!clockState.running) return base;
  return Math.max(0, base - (Date.now() - Number(clockState.startedAt)));
}

function formatTime(ms) {
  const total = Math.ceil(ms / 1000);
  return Math.floor(total / 60) + ":" +
    String(total % 60).padStart(2, "0");
}

db.ref("scoreboard").on("value", snapshot => {
  const data = snapshot.val();
  if (!data) return;

  document.getElementById("homeName").textContent = data.homeName || "HOME";
  document.getElementById("homeScore").textContent = data.homeScore ?? 0;
  document.getElementById("awayName").textContent = data.awayName || "AWAY";
  document.getElementById("awayScore").textContent = data.awayScore ?? 0;
  document.getElementById("period").textContent = data.period || "Q1";

  if (data.clock && typeof data.clock === "object") {
    clockState = data.clock;
  } else if (typeof data.clock === "string") {
    // Compatibility with the old controller's "10:00" clock.
    const parts = data.clock.split(":").map(Number);
    if (parts.length === 2 && parts.every(Number.isFinite)) {
      clockState = {
        remainingMs: (parts[0] * 60 + parts[1]) * 1000,
        running: false,
        startedAt: null
      };
    }
  }

  document.getElementById("error").textContent = "";
}, error => {
  document.getElementById("error").textContent =
    "Firebase error: " + error.message;
});

function renderClock() {
  const ms = getRemaining();
  document.getElementById("clock").textContent = formatTime(ms);

  const running = clockState.running && ms > 0;
  document.getElementById("clockStatus").textContent =
    running ? "LIVE" : "PAUSED";
  document.getElementById("clock").classList.toggle("paused", !running);
}

setInterval(renderClock, 50);
</script>
</body>
</html>
